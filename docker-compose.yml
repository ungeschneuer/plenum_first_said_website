version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: bundestag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: bundestag_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-bundestag}
      POSTGRES_USER: ${DB_USER:-bundestag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bundestag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bundestag}"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
