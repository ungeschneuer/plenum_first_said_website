name: Daten aktualisieren und veröffentlichen

on:
  schedule:
    # Täglich am späten Abend; DIP stellt Protokolltexte oft erst Tage nach der Sitzung bereit. Zur vollen Stunde
    # und am Morgen der USA startet GitHub geplante Läufe oft Stunden später.
    - cron: '43 21 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DATA_RELEASE: daten
  DATA_ARCHIVE: static-data.tar.gz

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      # Nur wenn das Seitenpaket hochgeladen wurde, wird veröffentlicht.
      artifact: ${{ steps.upload.outputs.artifact_id }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Lemmatisierung prüfen
        run: |
          pip install -r pipeline/requirements.txt
          python -m unittest discover --start-directory pipeline --top-level-directory pipeline

      - name: Strukturierte Protokolle aus früheren Läufen
        uses: actions/cache@v6
        with:
          path: .cache/structured-protocols
          key: structured-protocols-${{ github.run_id }}
          restore-keys: structured-protocols-

      - name: Vorigen Datenstand laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DATA_RELEASE" --pattern "$DATA_ARCHIVE" --dir "$RUNNER_TEMP"
          mkdir previous-data
          tar -xzf "$RUNNER_TEMP/$DATA_ARCHIVE" -C previous-data

      # Neue Zählregeln wirken erst nach einem Neuaufbau; bis dahin bleibt der Datenstand unverändert.
      - name: Zählregeln mit dem Datenstand vergleichen
        id: rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(python pipeline/rules_version.py)
          previous=$(jq -r '.zaehlregeln // ""' previous-data/stand.json 2>/dev/null || true)
          if [ "$current" = "$previous" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Der Datenstand wurde mit anderen Zählregeln erstellt (${previous:-unbekannt}, jetzt $current). Der Neuaufbau ist gestartet und veröffentlicht die Seite danach."
            gh workflow run rebuild.yml --ref "$GITHUB_REF_NAME"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Neue Protokolle aufnehmen
        if: steps.rules.outputs.current == 'true'
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: |
          sources="--previous previous-data"
          if [ -n "$DIP_API_KEY" ]; then
            sources="$sources --fetch-dip"
          else
            echo "::warning::Secret DIP_API_KEY fehlt, es werden keine neuen Protokolle geholt."
          fi
          python pipeline/export_static_data.py $sources --output static-data
          # Die Statistiken hängen nicht an den Zählregeln und werden bei jedem Lauf neu geschrieben.
          python pipeline/speaker_statistics.py static-data
          python pipeline/word_statistics.py static-data

      # Ausbleibende Protokolle halten die Veröffentlichung nicht auf; der Lauf schlägt erst am Ende fehl.
      - name: Aktualität prüfen
        id: fresh
        if: steps.rules.outputs.current == 'true'
        continue-on-error: true
        run: python pipeline/check_freshness.py static-data

      - name: Neuen Datenstand im Release sichern
        id: save
        if: steps.rules.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if cmp -s previous-data/protocols.json static-data/protocols.json; then
            echo "Keine neuen Protokolle."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$RUNNER_TEMP/$DATA_ARCHIVE" -C static-data .
            gh release upload "$DATA_RELEASE" "$RUNNER_TEMP/$DATA_ARCHIVE" --clobber
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.rules.outputs.current == 'true' && (github.event_name != 'schedule' || steps.save.outputs.changed == 'true')
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Website bauen
        if: steps.rules.outputs.current == 'true' && (github.event_name != 'schedule' || steps.save.outputs.changed == 'true')
        working-directory: frontend
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build
          rm -f dist/stats.html
          mv ../static-data dist/data
          # Ein Vorschaubild für jede Person und jedes neue Wort.
          npx playwright install --with-deps --only-shell chromium
          node scripts/og-images.mjs --dist dist
          # Jede Seite erhält eine eigene HTML-Datei mit Titel, Beschreibung und Vorschaubild für Links. GitHub Pages
          # kennt keine Weiterleitung auf index.html; die 404-Seite lädt für alle übrigen Pfade dieselbe App.
          node scripts/page-html.mjs dist "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - id: upload
        uses: actions/upload-pages-artifact@v5
        if: steps.rules.outputs.current == 'true' && (github.event_name != 'schedule' || steps.save.outputs.changed == 'true')
        with:
          path: frontend/dist

      - name: Bei ausbleibenden Protokollen fehlschlagen
        if: steps.fresh.outcome == 'failure'
        run: |
          echo "::error::Seit Wochen kein neues Protokoll; Einzelheiten im Schritt Aktualität prüfen."
          exit 1

  # Eigener Job: deploy-pages fand das Seitenpaket direkt nach dem Hochladen im selben Job mehrfach nicht
  # ("No artifacts named github-pages"). Ein zweiter Versuch folgt nach einer Pause. Veröffentlicht wird auch dann,
  # wenn der erste Job erst nach dem Hochladen an der Aktualitätsprüfung scheitert.
  deploy:
    needs: update-and-build
    if: ${{ !cancelled() && needs.update-and-build.outputs.artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vor dem zweiten Versuch warten
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
