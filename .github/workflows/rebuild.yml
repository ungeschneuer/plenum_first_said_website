name: Daten vollständig neu aufbauen

# Nötig, wenn sich die Zählregeln ändern (pipeline/rules_version.py): Wortformen behalten sonst ihr Lemma. Der
# tägliche Lauf startet ihn dann selbst. Holt alle Protokolle aus DIP, vergleicht das Ergebnis mit dem bisherigen
# Datenstand, ersetzt ihn im Release und veröffentlicht danach die Seite.
on:
  workflow_dispatch:
    inputs:
      ohne_pruefung:
        description: 'Datenstand auch ersetzen, wenn er stark vom bisherigen abweicht (nach gewollten großen Änderungen)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DATA_RELEASE: daten
  DATA_ARCHIVE: static-data.tar.gz

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Strukturierte Protokolle aus früheren Läufen
        uses: actions/cache@v6
        with:
          path: .cache/structured-protocols
          key: structured-protocols-${{ github.run_id }}
          restore-keys: structured-protocols-

      # Wiederherstellen und Sichern getrennt: die Archive bleiben auch erhalten, wenn der Lauf abbricht.
      - name: Protokollarchive und PDFs aus früheren Läufen
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/archives
            .cache/pdf
          key: protocol-texts-${{ github.run_id }}
          restore-keys: protocol-texts-

      - name: Lemmatisierung prüfen
        run: |
          pip install -r pipeline/requirements.txt
          python -m unittest discover --start-directory pipeline --top-level-directory pipeline

      - name: Alle Protokolle aus DIP zählen
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: |
          python pipeline/export_static_data.py --fetch-dip --fetch-dip-from 1949-01-01 --output static-data
          python pipeline/speaker_statistics.py static-data
          python pipeline/word_statistics.py static-data
          python pipeline/month_highlights.py static-data

      - name: Protokollarchive und PDFs sichern
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/archives
            .cache/pdf
          key: protocol-texts-${{ github.run_id }}

      - name: Bisherigen Datenstand laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DATA_RELEASE" --pattern "$DATA_ARCHIVE" --output "$RUNNER_TEMP/previous.tar.gz"
          mkdir previous-data
          tar -xzf "$RUNNER_TEMP/previous.tar.gz" -C previous-data

      - name: Neuen Datenstand mit dem bisherigen vergleichen
        if: ${{ !inputs.ohne_pruefung }}
        run: python pipeline/compare_data.py previous-data static-data

      # Von den Datenständen im Release bleiben nur der neue und die Sicherung vor diesem Neuaufbau erhalten.
      - name: Bisherigen Datenstand aufheben und neuen speichern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          backup="static-data-vor-neuaufbau-$(date +%Y-%m-%d).tar.gz"
          mv "$RUNNER_TEMP/previous.tar.gz" "$RUNNER_TEMP/$backup"
          gh release upload "$DATA_RELEASE" "$RUNNER_TEMP/$backup" --clobber
          tar -czf "$RUNNER_TEMP/$DATA_ARCHIVE" -C static-data .
          gh release upload "$DATA_RELEASE" "$RUNNER_TEMP/$DATA_ARCHIVE" --clobber
          gh release view "$DATA_RELEASE" --json assets --jq '.assets[].name' \
            | grep '^static-data-' | grep -vxF -e "$backup" -e "$DATA_ARCHIVE" \
            | while read -r old_backup; do gh release delete-asset "$DATA_RELEASE" "$old_backup" --yes; done

      - name: Seite veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
