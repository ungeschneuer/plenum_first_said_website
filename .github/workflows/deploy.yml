name: Deploy to Uberspace

on:
  push:
    branches: [main]
  workflow_dispatch:

# Kein user-kontrollierter Input in Scripts - nur vorkonfigurierte Secrets
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Pull latest backend on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.UBERSPACE_SSH_KEY }}
          script: |
            set -e
            cd ~/bundestag
            git fetch origin main
            git reset --hard origin/main
            cd backend
            ~/.local/bin/uv sync
            supervisorctl restart bundestag-api
            sleep 2
            supervisorctl status bundestag-api

      - name: Upload frontend to Uberspace
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.htaccess'
          path: frontend/dist/
          remote_path: /home/${{ secrets.UBERSPACE_USER }}/html/
          remote_host: ${{ secrets.UBERSPACE_HOST }}
          remote_user: ${{ secrets.UBERSPACE_USER }}
          remote_key: ${{ secrets.UBERSPACE_SSH_KEY }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.UBERSPACE_SSH_KEY }}
          script: |
            sleep 3
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/status)
            if [ "$STATUS" = "200" ]; then
              echo "Deployment successful - API responding with HTTP 200"
            else
              echo "ERROR: API returned HTTP $STATUS"
              supervisorctl status
              tail -20 ~/logs/bundestag-api-error.log
              exit 1
            fi
